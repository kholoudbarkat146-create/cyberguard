 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard Pro Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f7f6; color: #333; direction: rtl; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #0056b3; margin-bottom: 5px; font-size: 24px; }
        p.subtitle { color: #666; margin-bottom: 20px; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #444; font-size: 14px; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.3s; margin-top: 5px; }
        button:hover { background-color: #0056b3; }
        .loading { display: none; text-align: center; margin: 20px 0; color: #007bff; font-weight: bold; }
        .results-section { margin-top: 25px; border-top: 2px solid #eee; padding-top: 20px; display: none; }
        .score-box { background: #e8f4fd; padding: 15px; border-radius: 6px; margin-bottom: 15px; font-size: 18px; font-weight: bold; color: #0056b3; text-align: center; }
        .card { background: #fafafa; border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .card h3 { margin-bottom: 10px; font-size: 15px; color: #333; }
        ul { padding-right: 20px; }
        li { margin-bottom: 5px; font-size: 14px; }
        .badge-success { color: green; font-weight: bold; }
        .badge-danger { color: red; font-weight: bold; }
        .history-section { margin-top: 30px; border-top: 2px solid #eee; padding-top: 15px; }
        .history-list { list-style: none; padding: 0; max-height: 150px; overflow-y: auto; }
        .history-item { background: #f9f9f9; padding: 8px 12px; margin-bottom: 6px; border-radius: 4px; border: 1px solid #e1e1e1; display: flex; justify-content: space-between; font-size: 13px; }
        .clear-btn { background-color: #dc3545; padding: 6px 12px; font-size: 13px; width: auto; float: left; margin-top: 10px; }
        .clear-btn:hover { background-color: #bd2130; }
        .export-btn { background-color: #28a745; margin-bottom: 15px; }
        .export-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h1>CyberGuard Pro Dashboard</h1>
    <p class="subtitle">منصتك الاحترافية لفحص حماية وثغرات المواقع</p>

    <div class="form-group">
        <label for="targetUrl">رابط الموقع المستهدف:</label>
        <input type="text" id="targetUrl" placeholder="https://example.com">
    </div>

    <div class="form-group">
        <label for="scanType">اختر نوع الفحص:</label>
        <select id="scanType">
            <option value="quick">فحص أمني سريع & Headers & SSL</option>
            <option value="headers">فحص الترويسات الأمنية فقط (Security Headers)</option>
            <option value="ssl">فحص صلاحية وحالة شهادة الـ SSL</option>
        </select>
    </div>

    <button onclick="startClientScan()">بدء عملية الفحص الآن</button>

    <div id="loading" class="loading">جاري فحص الموقع وتحليل الإعدادات...</div>

    <div id="resultsSection" class="results-section">
        <button class="export-btn" onclick="exportReport()">📥 تحميل التقرير (TXT)</button>
        <div id="scoreBox" class="score-box">التقييم الأمني: 100/100</div>

        <div class="card">
            <h3>نتيجة فحص الأمان والشهادة:</h3>
            <div id="sslResult"></div>
        </div>

        <div class="card">
            <h3>تحليل ترويسات الأمان (Security Headers):</h3>
            <div id="headersResult"></div>
        </div>
[10/8/2026 6:25 PM] ....: <div class="card">
            <h3>التوصيات الأمنية للإصلاح:</h3>
            <ul id="recommendationsList"></ul>
        </div>
    </div>

    <div class="history-section">
        <label>سجل عمليات الفحص السابقة:</label>
        <ul id="historyList" class="history-list">
            <li style="color: #777; text-align: center;">لا توجد عمليات فحص في هذه الجلسة بعد.</li>
        </ul>
        <button class="clear-btn" onclick="clearHistory()">مسح السجل</button>
        <div style="clear: both;"></div>
    </div>
</div>

<script>
    let lastScanData = null;

    // تحميل السجل عند فتح الصفحة
    window.onload = function() {
        loadHistory();
    }

    function startClientScan() {
        let urlInput = document.getElementById('targetUrl').value.trim();
        if (!urlInput) {
            alert('الرجاء إدخال رابط الموقع أولاً');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultsSection').style.display = 'none';

        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';

            let score = 100;
            let recommendations = [];
            let isHttps = urlInput.startsWith('https://');
            
            if (!urlInput.startsWith('http://') && !urlInput.startsWith('https://')) {
                urlInput = 'https://' + urlInput;
                isHttps = true;
            }

            let sslHtml = '';
            if (isHttps) {
                sslHtml = <p class="badge-success">✔ الموقع يدعم بروتوكول HTTPS المشفر وآمن.</p>;
            } else {
                sslHtml = <p class="badge-danger">✖ الموقع يستخدم بروتوكول HTTP غير المشفر (عرضة للاختراق).</p>;
                score -= 30;
                recommendations.push('قم بتفعيل شهادة SSL وإجبار استخدام بروتوكول HTTPS.');
            }

            let headersHtml = '<ul>';
            let mockHeaders = [
                { name: 'Strict-Transport-Security (HSTS)', secure: isHttps },
                { name: 'X-Frame-Options', secure: true },
                { name: 'X-Content-Type-Options', secure: true },
                { name: 'Content-Security-Policy (CSP)', secure: false }
            ];

            mockHeaders.forEach(h => {
                if (h.secure) {
                    headersHtml += <li><strong>${h.name}:</strong> <span class="badge-success">مفعل</span></li>;
                } else {
                    headersHtml += <li><strong>${h.name}:</strong> <span class="badge-danger">مفقود</span></li>;
                    score -= 15;
                    recommendations.push(إضافة ترويسة الأمان: ${h.name});
                }
            });
            headersHtml += '</ul>';

            if (score < 0) score = 0;

            lastScanData = {
                url: urlInput,
                score: score,
                date: new Date().toLocaleString('ar-EG'),
                recommendations: recommendations
            };

            // عرض النتائج
            document.getElementById('scoreBox').innerHTML = التقييم الأمني للموقع: ${score} / 100;
            document.getElementById('sslResult').innerHTML = sslHtml;
            document.getElementById('headersResult').innerHTML = headersHtml;

            let recHtml = '';
            if (recommendations.length === 0) {
                recHtml = '<li>ممتاز! الإعدادات الأساسية تبدو سليمة وآمنة.</li>';
            } else {
                recommendations.forEach(r => {
                    recHtml += <li>⚠️ ${r}</li>;
                });
            }
            document.getElementById('recommendationsList').innerHTML = recHtml;
            document.getElementById('resultsSection').style.display = 'block';

            // حفظ في السجل
            saveToHistory(lastScanData);

        }, 800);
    }
[10/8/2026 6:25 PM] ....: function saveToHistory(data) {
        let history = JSON.parse(localStorage.getItem('cyberguard_history')) || [];
        history.unshift(data); // إضافة في البداية
        if (history.length > 10) history.pop(); // الاحتفاظ بأحدث 10 عمليات فقط
        localStorage.setItem('cyberguard_history', JSON.stringify(history));
        loadHistory();
    }

    function loadHistory() {
        let history = JSON.parse(localStorage.getItem('cyberguard_history')) || [];
        let historyListEl = document.getElementById('historyList');
        
        if (history.length === 0) {
            historyListEl.innerHTML = '<li style="color: #777; text-align: center;">لا توجد عمليات فحص في هذه الجلسة بعد.</li>';
            return;
        }

        let html = '';
        history.forEach(item => {
            let badgeColor = item.score > 70 ? 'green' : 'red';
            html += <li class="history-item">
                <span>🌐 <strong>${item.url}</strong> (${item.date})</span>
                <span style="color: ${badgeColor}; font-weight: bold;">التقييم: ${item.score}/100</span>
            </li>;
        });
        historyListEl.innerHTML = html;
    }

    function clearHistory() {
        localStorage.removeItem('cyberguard_history');
        loadHistory();
    }

    function exportReport() {
        if (!lastScanData) return;
        let content = --- CyberGuard Pro Security Report ---\n;
        content += Target URL: ${lastScanData.url}\n;
        content += Scan Date: ${lastScanData.date}\n;
        content += Security Score: ${lastScanData.score} / 100\n\n;
        content += Recommendations:\n;
        lastScanData.recommendations.forEach((rec, idx) => {
            content += ${idx + 1}. ${rec}\n;
        });

        let blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        let link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = CyberGuard_Report_${Date.now()}.txt;
        link.click();
    }
</script>

</body>
</html>
